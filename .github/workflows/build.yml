name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # Sign with the same debug key as the installed APK so builds can update it in place.
      # Without the secret, Gradle generates a throwaway key.
      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      - run: ./gradlew assembleDebug

      - run: mv app/build/outputs/apk/debug/app-debug.apk InstallGuard.apk

      - uses: actions/upload-artifact@v7
        with:
          name: InstallGuard
          path: InstallGuard.apk

      - if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Install Guard 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: InstallGuard.apk
